repos:
  - repo: local
    hooks:
      - id: mypy-strict
        name: mypy 100% typed (src, tests, Pydantic)
        entry: uv run --locked mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: no-type-ignore
        name: reject type ignore bypasses
        entry: '#\s*type:\s*ignore\b'
        language: pygrep
        types: [python]
